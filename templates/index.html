<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PES Lobby</title>
<style>
:root{
  --bg:#07070f;--surface:#0f0f1c;--card:#14142a;--border:#252540;
  --accent:#00e676;--blue:#4d79ff;--red:#ff4d6d;
  --text:#e2e2f0;--muted:#55557a;
  --t1:#ffd700;--t2:#c0c0c0;--t3:#cd7f32;--t4:#4d79ff;--t5:#55557a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

header{
  position:sticky;top:0;z-index:100;
  background:rgba(7,7,15,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;gap:12px;
}
header h1{font-size:1.15rem;font-weight:700}
header h1 span{color:var(--accent)}
.online-badge{
  background:rgba(0,230,118,.1);color:var(--accent);
  border:1px solid rgba(0,230,118,.25);
  padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:600;
}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--border);
  padding:5px 14px 5px 10px;border-radius:20px;font-size:.83rem;
  cursor:pointer;transition:.2s;
}
.user-chip:hover{border-color:var(--accent);color:var(--accent)}

main{max-width:960px;margin:0 auto;padding:24px 16px}

/* My panel */
#my-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:18px 22px;margin-bottom:24px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.my-info{flex:1;min-width:140px}
.my-name{font-weight:700}
.my-meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.my-link{font-size:.76rem;color:var(--muted);margin-top:2px;word-break:break-all}
.my-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Match banner */
#match-banner{
  display:none;
  background:linear-gradient(135deg,rgba(0,230,118,.12),rgba(77,121,255,.12));
  border:1px solid var(--accent);border-radius:14px;
  padding:20px 24px;margin-bottom:24px;text-align:center;
}
#match-banner h2{color:var(--accent);margin-bottom:8px;font-size:1.05rem}
#match-banner p{color:var(--muted);font-size:.87rem;margin-bottom:14px}
.btn-join{
  display:inline-block;background:var(--accent);color:#000;
  font-weight:700;padding:11px 30px;border-radius:10px;
  text-decoration:none;font-size:.95rem;transition:.2s;
}
.btn-join:hover{background:#00ff8a;transform:scale(1.02)}

.section-title{
  font-size:.76rem;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:14px;
}

#lobby{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
}
.empty{grid-column:1/-1;text-align:center;padding:56px 0;color:var(--muted)}
.empty span{display:block;font-size:2.4rem;margin-bottom:10px}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px;
  transition:transform .2s,border-color .2s;position:relative;
}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card.locked{opacity:.45;pointer-events:none}
.card.matched-me{border-color:var(--accent)}

.card-name{font-weight:700;font-size:.95rem;margin-bottom:4px}
.card-ingame{font-size:.76rem;color:var(--muted);font-family:monospace;margin-bottom:10px}
.card-badges{display:flex;gap:6px;margin-bottom:12px}
.badge{padding:3px 8px;border-radius:6px;font-size:.7rem;font-weight:700}
.t1{background:rgba(255,215,0,.14);color:var(--t1)}
.t2{background:rgba(192,192,192,.14);color:var(--t2)}
.t3{background:rgba(205,127,50,.14);color:var(--t3)}
.t4{background:rgba(77,121,255,.14);color:var(--t4)}
.t5{background:rgba(85,85,122,.14);color:var(--t5)}

.card-actions{display:flex;gap:7px}
.btn-host{
  flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);cursor:pointer;
  font-size:.78rem;font-weight:600;transition:.2s;
}
.btn-host:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-host.them:hover{background:var(--accent);border-color:var(--accent);color:#000}
.btn-host:disabled{opacity:.3;cursor:not-allowed}
.card-matched-content{text-align:center;padding:6px 0}
.card-matched-content p{font-size:.78rem;color:var(--muted);margin-bottom:10px}
.btn-parsec{
  display:inline-block;background:var(--accent);color:#000;
  font-weight:700;padding:8px 18px;border-radius:8px;
  text-decoration:none;font-size:.82rem;transition:.2s;
}
.btn-parsec:hover{background:#00ff8a}

.pulse{
  position:absolute;top:12px;right:12px;
  width:7px;height:7px;border-radius:50%;background:var(--accent);
}
.pulse::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--accent);animation:pulse 1.6s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2.8);opacity:0}}

.btn{padding:8px 18px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:.84rem;transition:.2s}
.btn-green{background:var(--accent);color:#000}
.btn-green:hover{background:#00ff8a}
.btn-green:disabled{background:#1a3d2b;color:#2a6b47;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 12px;font-size:.78rem}

.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.78);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:26px;width:min(420px,94vw);
}
.modal h2{font-size:1.05rem;margin-bottom:18px;color:var(--accent)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select{
  width:100%;padding:9px 11px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:.88rem;outline:none;transition:.2s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group input::placeholder{color:var(--muted)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}

#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1px solid var(--border);
  padding:11px 22px;border-radius:10px;font-size:.86rem;
  transition:transform .3s;z-index:999;white-space:nowrap;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}

.spin{display:inline-block;width:13px;height:13px;border:2px solid transparent;
  border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;
  vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  #my-panel{flex-direction:column;align-items:flex-start}
  .my-actions{width:100%}.my-actions .btn{flex:1}
}
</style>
</head>
<body>

<header>
  <h1>⚽ PES <span>LOBBY</span></h1>
  <span class="online-badge" id="online-count">🟢 0 online</span>
  <div class="header-right" id="header-right" style="display:none">
    <div class="user-chip" onclick="openModal()">✏ <span id="header-name">–</span></div>
  </div>
</header>

<main>
  <div id="my-panel" style="display:none">
    <div class="my-info">
      <div class="my-name" id="my-name">–</div>
      <div class="my-meta" id="my-meta">–</div>
      <div class="my-link" id="my-link"></div>
    </div>
    <div class="my-actions">
      <button class="btn btn-green" id="btn-ready" onclick="toggleReady()">🟢 Tìm đối</button>
      <button class="btn btn-outline" id="btn-cancel" style="display:none" onclick="cancelReady()">✕ Hủy</button>
    </div>
  </div>

  <div id="match-banner">
    <h2>⚔️ Trận đấu bắt đầu!</h2>
    <p id="match-desc">Đối thủ đang host — nhấn để vào Parsec!</p>
    <a id="btn-join-link" class="btn-join" target="_blank" rel="noopener">🔗 Vào Parsec ngay →</a>
  </div>

  <div class="section-title">Đang tìm đối</div>
  <div id="lobby">
    <div class="empty"><span>😴</span>Chưa có ai đang tìm đối</div>
  </div>
</main>

<div id="toast"></div>

<!-- Modal đăng ký / chỉnh sửa hồ sơ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">👋 Tạo hồ sơ</h2>
    <div class="form-group">
      <label>Tên hiển thị</label>
      <input id="f-name" placeholder="Tên của bạn" maxlength="30">
    </div>
    <div class="form-group">
      <label>ID Parsec</label>
      <input id="f-ingame" placeholder="VD: nhimbeti" maxlength="30">
    </div>
    <div class="form-group">
      <label>Tier</label>
      <select id="f-tier">
        <option value="Tier 1">Tier 1 ⭐⭐⭐⭐⭐</option>
        <option value="Tier 2">Tier 2 ⭐⭐⭐⭐</option>
        <option value="Tier 3" selected>Tier 3 ⭐⭐⭐</option>
        <option value="Tier 4">Tier 4 ⭐⭐</option>
        <option value="Tier 5">Tier 5 ⭐</option>
      </select>
    </div>
    <div class="form-group">
      <label>Link Parsec <small style="color:var(--muted)">(để trống nếu chưa có)</small></label>
      <input id="f-parsec" placeholder="https://parsec.app/...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="btn-modal-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn btn-green" onclick="saveProfile()">💾 Lưu</button>
    </div>
  </div>
</div>

<script>
const TIER_STARS = {'Tier 1':'⭐⭐⭐⭐⭐','Tier 2':'⭐⭐⭐⭐','Tier 3':'⭐⭐⭐','Tier 4':'⭐⭐','Tier 5':'⭐'};
const TIER_CLASS  = {'Tier 1':'t1','Tier 2':'t2','Tier 3':'t3','Tier 4':'t4','Tier 5':'t5'};

let S = {
  webId:   localStorage.getItem('pes_id'),
  profile: null,
  ready:   false,
  matched: false,
};

function hdr() {
  return S.webId ? { 'Content-Type':'application/json','X-Web-Id': S.webId } : { 'Content-Type':'application/json' };
}
async function api(path, method='GET', body=null) {
  const r = await fetch(path, { method, headers: hdr(), body: body ? JSON.stringify(body) : null });
  return r.json();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  if (S.webId) {
    const d = await api('/api/profile');
    if (d.web_id) {
      S.profile = d;
      renderPanel();
    } else {
      // ID cũ không còn tồn tại, xóa đi
      localStorage.removeItem('pes_id');
      S.webId = null;
    }
  }

  // Nếu chưa có profile → mở modal đăng ký ngay
  if (!S.profile) {
    document.getElementById('modal-title').textContent = '👋 Tạo hồ sơ';
    document.getElementById('btn-modal-cancel').style.display = 'none';
    openModal();
  }

  await refreshLobby();
  pingOnline();
  setInterval(refreshLobby, 3000);
  setInterval(checkStatus,  2500);
  setInterval(pingOnline,   10000);
}

async function pingOnline() {
  if (!S.webId) return;
  const d = await api('/api/ping', 'POST', {});
  if (d.online !== undefined)
    document.getElementById('online-count').textContent = `🟢 ${d.online} online`;
}

// ── Panel ─────────────────────────────────────────────────────────────────────
function renderPanel() {
  const p = S.profile;
  if (!p) return;
  document.getElementById('my-panel').style.display    = 'flex';
  document.getElementById('header-right').style.display = 'flex';
  document.getElementById('header-name').textContent   = p.display_name;
  document.getElementById('my-name').textContent       = p.display_name;
  const ts = TIER_STARS[p.tier] || '';
  document.getElementById('my-meta').textContent = `${ts} ${p.tier}  🎮 ${p.ingame_name}`;
  document.getElementById('my-link').textContent =
    p.parsec_link ? `🔗 ${p.parsec_link}` : '🔗 Chưa đặt link Parsec';
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
async function refreshLobby() {
  const players = await api('/api/lobby');
  const myId    = S.webId;
  const others  = players.filter(p => p.web_id !== myId);
  const el = document.getElementById('lobby');
  if (!others.length) {
    el.innerHTML = `<div class="empty"><span>😴</span>Chưa có ai đang tìm đối<br>
      <small style="margin-top:6px;display:block">Nhấn "Tìm đối" để vào hàng chờ!</small></div>`;
    return;
  }
  el.innerHTML = others.map(buildCard).join('');
}

function buildCard(p) {
  const tc   = TIER_CLASS[p.tier] || 't5';
  const ts   = TIER_STARS[p.tier] || '';
  const myId = S.webId;

  if (!p.is_ready && p.matched_with && p.matched_with !== myId) {
    return `<div class="card locked">
      <div class="card-name">${e(p.display_name)}</div>
      <div style="color:var(--muted);font-size:.8rem;margin-top:8px">🔒 Đã có đôi</div>
    </div>`;
  }

  if (!p.is_ready && p.matched_with === myId && p.match_link) {
    return `<div class="card matched-me">
      <div class="card-name">${e(p.display_name)}</div>
      <div class="card-ingame">🎮 ${e(p.ingame_name)}</div>
      <div class="card-matched-content">
        <p>⚔️ Đang host cho bạn!</p>
        <a class="btn-parsec" href="${e(p.match_link)}" target="_blank" rel="noopener">🔗 Vào Parsec →</a>
      </div>
    </div>`;
  }

  const canConnect = !!S.profile && p.web_id !== S.webId;
  const actions = canConnect
    ? `<div class="card-actions">
        <button class="btn-host them" onclick="connect('${p.web_id}','them')">🏠 Host bạn</button>
        <button class="btn-host"      onclick="connect('${p.web_id}','me')">🏠 Host tôi</button>
      </div>`
    : `<div class="card-actions">
        <button class="btn-host" disabled style="flex:1;font-size:.74rem">⚠️ Đăng ký để kết nối</button>
      </div>`;

  return `<div class="card">
    <div class="pulse"></div>
    <div class="card-name">${e(p.display_name)}</div>
    <div class="card-ingame">🎮 ${e(p.ingame_name)}</div>
    <div class="card-badges"><span class="badge ${tc}">${ts} ${p.tier}</span></div>
    ${actions}
  </div>`;
}

// ── Sound ─────────────────────────────────────────────────────────────────────
function playMatchSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
      gain.gain.linearRampToValueAtTime(0, t + 0.18);
      osc.start(t); osc.stop(t + 0.2);
    });
  } catch(e) {}
}

// ── Status poll ───────────────────────────────────────────────────────────────
async function checkStatus() {
  if (!S.webId || S.matched) return;
  const s = await api('/api/status');
  if (s.matched_with && s.match_link && !S.matched) {
    S.matched = true; S.ready = false;
    updateReadyBtn();
    playMatchSound();
    document.getElementById('btn-join-link').href = s.match_link;
    document.getElementById('match-banner').style.display = 'block';
    document.getElementById('match-banner').scrollIntoView({behavior:'smooth',block:'center'});
  }
}

// ── Ready ─────────────────────────────────────────────────────────────────────
async function toggleReady() {
  if (!S.profile) { openModal(); return; }
  if (S.ready) { cancelReady(); return; }
  S.ready = true; S.matched = false;
  document.getElementById('match-banner').style.display = 'none';
  updateReadyBtn();
  await api('/api/ready','POST',{});
  toast('🟢 Đang tìm đối...');
  refreshLobby();
}

async function cancelReady() {
  S.ready = false; updateReadyBtn();
  await api('/api/cancel','POST',{});
  toast('🔴 Đã hủy');
  refreshLobby();
}

function updateReadyBtn() {
  const r = document.getElementById('btn-ready');
  const c = document.getElementById('btn-cancel');
  if (S.ready) {
    r.innerHTML = '<span class="spin"></span>Đang tìm...'; r.disabled = true;
    c.style.display = 'inline-block';
  } else {
    r.innerHTML = '🟢 Tìm đối'; r.disabled = false;
    c.style.display = 'none';
  }
}

// ── Connect ───────────────────────────────────────────────────────────────────
async function connect(targetId, host) {
  if (!S.profile) { openModal(); return; }
  if (host === 'me' && !S.profile.parsec_link) {
    toast('⚠️ Bạn chưa đặt link Parsec! Cập nhật hồ sơ.', true);
    openModal(); return;
  }
  const d = await api('/api/connect','POST',{ target_id: targetId, host });
  if (d.error) { toast('⚠️ ' + d.error, true); refreshLobby(); return; }

  if (host === 'them' && d.link) window.open(d.link,'_blank','noopener');
  toast(host === 'them' ? `✅ Kết nối với ${d.opponent}!` : `✅ Bạn đang host! Chờ ${d.opponent} vào.`);
  S.matched = true; S.ready = false;
  updateReadyBtn(); refreshLobby();
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal() {
  const p = S.profile;
  document.getElementById('modal-title').textContent = p ? '✏️ Chỉnh hồ sơ' : '👋 Tạo hồ sơ';
  document.getElementById('btn-modal-cancel').style.display = p ? 'block' : 'none';
  if (p) {
    document.getElementById('f-name').value   = p.display_name || '';
    document.getElementById('f-ingame').value = p.ingame_name  || '';
    document.getElementById('f-tier').value   = p.tier         || 'Tier 3';
    document.getElementById('f-parsec').value = p.parsec_link  || '';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  if (!S.profile) return; // bắt buộc phải điền lần đầu
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

async function saveProfile() {
  const name   = document.getElementById('f-name').value.trim();
  const ingame = document.getElementById('f-ingame').value.trim();
  if (!name || !ingame) { toast('⚠️ Điền đầy đủ tên!', true); return; }

  const d = await api('/api/register','POST',{
    web_id:       S.webId,
    display_name: name,
    ingame_name:  ingame,
    tier:         document.getElementById('f-tier').value,
    parsec_link:  document.getElementById('f-parsec').value.trim(),
  });

  if (d.error) { toast('⚠️ ' + d.error, true); return; }
  S.webId   = d.web_id;
  S.profile = d.profile;
  localStorage.setItem('pes_id', d.web_id);
  document.getElementById('modal').classList.remove('open');
  renderPanel();
  toast('✅ Hồ sơ đã lưu!');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = err ? 'var(--red)' : 'var(--accent)';
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 3000);
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

boot();
</script>
</body>
</html>
