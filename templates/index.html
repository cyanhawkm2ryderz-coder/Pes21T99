<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PES Lobby</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:      var(--tg-theme-bg-color,           #17212b);
  --surface: var(--tg-theme-secondary-bg-color, #232e3c);
  --text:    var(--tg-theme-text-color,         #f5f5f5);
  --hint:    var(--tg-theme-hint-color,         #708499);
  --link:    var(--tg-theme-link-color,         #5288c1);
  --btn:     var(--tg-theme-button-color,       #5288c1);
  --btn-txt: var(--tg-theme-button-text-color,  #ffffff);
  --accent: #00e676; --red: #ff4d6d;
  --border: rgba(255,255,255,.07);
  --t1:#ffd700;--t2:#c0c0c0;--t3:#cd7f32;--t4:#5288c1;--t5:#708499;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* ── Header ── */
header{
  flex-shrink:0;background:var(--surface);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
header h1{font-size:1.05rem;font-weight:700;flex:1}
header h1 span{color:var(--accent)}
.badge-online{
  background:rgba(0,230,118,.12);color:var(--accent);
  border:1px solid rgba(0,230,118,.25);
  padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600
}
#avatar-btn{
  display:none;width:30px;height:30px;border-radius:50%;
  border:none;color:#fff;font-weight:700;font-size:.78rem;
  cursor:pointer;align-items:center;justify-content:center;
  touch-action:manipulation;flex-shrink:0
}

/* ── Scroll area ── */
#scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 72px)
}

/* ── My panel ── */
#my-panel{
  display:none;background:var(--surface);border-radius:14px;
  padding:12px 14px;margin-bottom:12px;
  flex-direction:row;align-items:center;gap:12px
}
.my-av{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;flex-shrink:0;color:#fff
}
.my-info{flex:1;min-width:0}
.my-name{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-sub{font-size:.73rem;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{
  width:9px;height:9px;border-radius:50%;background:var(--hint);flex-shrink:0
}
.status-dot.on{background:var(--accent);animation:pdot 1.5s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

/* ── Match banner ── */
#match-banner{
  display:none;background:linear-gradient(135deg,rgba(0,230,118,.12),rgba(82,136,193,.12));
  border:1px solid var(--accent);border-radius:14px;
  padding:16px;margin-bottom:12px;text-align:center
}
#match-banner h2{color:var(--accent);font-size:.98rem;margin-bottom:6px}
#match-banner p{color:var(--hint);font-size:.8rem;margin-bottom:12px}
.link-row{display:flex;gap:8px;justify-content:center;align-items:center}
.btn-join{
  flex:1;display:inline-block;background:var(--accent);color:#000;
  font-weight:700;padding:10px 16px;border-radius:10px;
  text-decoration:none;font-size:.88rem;text-align:center
}
.btn-copy{
  flex-shrink:0;padding:10px 14px;border-radius:10px;border:none;
  background:rgba(255,255,255,.1);color:var(--text);
  font-size:.9rem;cursor:pointer;touch-action:manipulation;
  transition:background .15s
}
.btn-copy:active{background:rgba(255,255,255,.2)}

/* ── Section label ── */
.section-label{
  font-size:.7rem;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--hint);
  margin-bottom:8px;padding:0 2px
}

/* ── Lobby ── */
#lobby{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;padding:48px 0;color:var(--hint)}
.empty span{display:block;font-size:2rem;margin-bottom:8px}

/* ── Card ── */
.card{
  background:var(--surface);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  transition:opacity .2s
}
.card.locked{opacity:.4;pointer-events:none}
.card.matched{border:1px solid var(--accent)}
.c-av{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;flex-shrink:0;
  position:relative;color:#fff
}
.c-av .dot{
  position:absolute;bottom:1px;right:1px;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface)
}
.c-info{flex:1;min-width:0}
.c-name{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-sub{font-size:.73rem;color:var(--hint);margin-top:3px}
.tbadge{
  display:inline-block;padding:1px 6px;border-radius:5px;
  font-size:.65rem;font-weight:700;margin-right:3px
}
.t1{background:rgba(255,215,0,.15);color:var(--t1)}
.t2{background:rgba(192,192,192,.15);color:var(--t2)}
.t3{background:rgba(205,127,50,.15);color:var(--t3)}
.t4{background:rgba(82,136,193,.15);color:var(--t4)}
.t5{background:rgba(112,132,153,.15);color:var(--t5)}
.htag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:.65rem;font-weight:700;margin-right:3px}
.has-host{background:rgba(0,230,118,.12);color:var(--accent)}
.no-host{background:rgba(255,77,109,.1);color:#ff6b8a}
.c-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.btn-h{
  padding:6px 11px;border-radius:8px;border:1px solid var(--border);
  background:transparent;font-size:.7rem;font-weight:600;
  cursor:pointer;touch-action:manipulation;transition:background .1s;
  white-space:nowrap
}
.btn-h.them{border-color:rgba(0,230,118,.4);color:var(--accent)}
.btn-h.me{border-color:rgba(82,136,193,.4);color:var(--link)}
.btn-h:active{opacity:.7;transform:scale(.95)}

/* ── Action row ── */
#action-row{display:none;gap:8px;margin-bottom:12px}
#action-row.show{display:flex}
.btn-act{
  flex:1;padding:13px 6px;border-radius:12px;border:none;
  font-weight:700;font-size:.84rem;cursor:pointer;
  touch-action:manipulation;transition:opacity .15s
}
.btn-act:active{opacity:.75}
.btn-act.manual{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-act.auto{background:var(--btn);color:var(--btn-txt)}
.btn-act.cancel{background:transparent;color:var(--red);border:1px solid rgba(255,77,109,.4)}

/* ── Bottom sheet ── */
.overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);align-items:flex-end
}
.overlay.open{display:flex}
.sheet{
  background:var(--bg);border-radius:18px 18px 0 0;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  width:100%;max-height:88vh;overflow-y:auto;
  animation:sup .25s ease
}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--hint);opacity:.35;
  margin:10px auto 18px
}
.sheet h2{font-size:1rem;font-weight:700;margin-bottom:16px}
.fgrp{margin-bottom:13px}
.fgrp label{display:block;font-size:.75rem;color:var(--hint);margin-bottom:4px}
.fgrp input,.fgrp select{
  width:100%;padding:11px 13px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:.88rem;outline:none;
  -webkit-appearance:none;transition:border-color .15s
}
.fgrp input:focus,.fgrp select:focus{border-color:var(--btn)}
.fgrp input::placeholder{color:var(--hint)}
.btn-save{
  width:100%;padding:13px;border-radius:11px;border:none;
  background:var(--btn);color:var(--btn-txt);
  font-weight:700;font-size:.92rem;cursor:pointer;
  touch-action:manipulation;margin-top:6px
}
.btn-save:active{opacity:.8}

/* ── Fallback buttons (non-Telegram) ── */
#fallback-btns{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:var(--surface);border-top:1px solid var(--border);
  gap:8px
}
.fbtn{
  flex:1;padding:12px;border-radius:11px;border:none;
  font-weight:700;font-size:.88rem;cursor:pointer;touch-action:manipulation
}
.fbtn-green{background:var(--accent);color:#000}
.fbtn-red{background:transparent;border:1px solid var(--red);color:var(--red)}

/* ── Toast ── */
#toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--surface);border:1px solid var(--border);
  padding:9px 18px;border-radius:20px;font-size:.8rem;
  opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;z-index:999;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.spin{display:inline-block;width:12px;height:12px;border:2px solid transparent;
  border-top-color:currentColor;border-radius:50%;
  animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Match overlay ── */
#match-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.82);
  align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
}
#match-overlay.show{display:flex}

#match-card{
  background:var(--surface);
  border:1.5px solid var(--accent);
  border-radius:22px;
  padding:32px 24px 24px;
  text-align:center;
  width:calc(100% - 40px);
  max-width:320px;
  position:relative;
  animation:mpop .4s cubic-bezier(.175,.885,.32,1.275) both
}
@keyframes mpop{from{transform:scale(.5) translateY(40px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.mc-ring{
  width:80px;height:80px;border-radius:50%;
  background:rgba(0,230,118,.12);
  border:2px solid rgba(0,230,118,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;margin:0 auto 16px;
  animation:mring 1s .3s ease-in-out infinite alternate
}
@keyframes mring{from{box-shadow:0 0 0 0 rgba(0,230,118,.4)}to{box-shadow:0 0 0 14px rgba(0,230,118,0)}}

.mc-title{font-size:1.2rem;font-weight:800;color:var(--accent);margin-bottom:6px}
.mc-vs{font-size:.8rem;color:var(--hint);margin-bottom:4px}
.mc-opp{font-size:1.1rem;font-weight:700;margin-bottom:20px}
.mc-nolink{font-size:.78rem;color:var(--hint);margin:10px 0 0}

#mc-join{
  flex:1;display:block;background:var(--accent);color:#000;
  font-weight:800;padding:13px 0;border-radius:12px;
  text-decoration:none;font-size:.95rem;text-align:center
}
#mc-copy{
  flex-shrink:0;padding:13px 16px;border-radius:12px;border:none;
  background:rgba(255,255,255,.1);color:var(--text);
  font-size:1rem;cursor:pointer;touch-action:manipulation
}
#mc-copy:active{background:rgba(255,255,255,.2)}
.mc-link-row{display:flex;gap:8px}
#mc-close{
  margin-top:11px;width:100%;padding:11px;
  border-radius:12px;border:1px solid var(--border);
  background:transparent;color:var(--hint);
  font-size:.85rem;cursor:pointer;touch-action:manipulation
}
.mc-timer{
  font-size:.68rem;color:var(--hint);margin-top:8px
}
</style>
</head>
<body>
<div id="app">

<header>
  <h1>⚽ PES <span>LOBBY</span></h1>
  <span class="badge-online" id="online-count">🟢 0 online</span>
  <button id="avatar-btn" onclick="openSheet()"></button>
</header>

<div id="scroll">

  <div id="my-panel">
    <div class="my-av" id="my-av"></div>
    <div class="my-info">
      <div class="my-name" id="my-name"></div>
      <div class="my-sub"  id="my-sub"></div>
    </div>
    <div class="status-dot" id="status-dot"></div>
  </div>

  <!-- Action buttons -->
  <div id="action-row">
    <button class="btn-act manual" id="btn-lobby"  onclick="doReady(false)">🎮 Vào Lobby</button>
    <button class="btn-act auto"   id="btn-auto"   onclick="doReady(true)">⚡ Tự Ghép</button>
    <button class="btn-act cancel" id="btn-cancel2" style="display:none" onclick="cancelReady()">✕ Hủy</button>
  </div>

  <div id="match-banner">
    <h2>⚔️ Ghép trận thành công!</h2>
    <p id="match-desc"></p>
    <div class="link-row" id="banner-link-row" style="display:none">
      <a id="btn-join" class="btn-join" target="_blank" rel="noopener">🔗 Vào Parsec →</a>
      <button class="btn-copy" onclick="copyLink('banner')" title="Copy link">📋</button>
    </div>
    <p id="match-nolink" style="display:none;color:var(--hint);font-size:.8rem;margin-top:8px">
      Chưa có link Parsec — liên hệ đối thủ để trao đổi link!
    </p>
  </div>

  <div class="section-label">Đang tìm đối</div>
  <div id="lobby">
    <div class="empty"><span>😴</span>Chưa có ai tìm đối</div>
  </div>
</div>

<!-- Fallback buttons for non-Telegram browser -->
<div id="fallback-btns">
  <button class="fbtn fbtn-green" id="fbtn-ready"  onclick="doReady(false)" style="flex:1">🎮 Vào Lobby</button>
  <button class="fbtn fbtn-red"   id="fbtn-cancel" style="display:none;flex:1" onclick="cancelReady()">✕ Hủy</button>
</div>

</div><!-- #app -->

<!-- Match popup overlay -->
<div id="match-overlay">
  <div id="match-card">
    <div class="mc-ring">⚔️</div>
    <div class="mc-title">Tìm được đối thủ!</div>
    <div class="mc-vs">Đối thủ của bạn</div>
    <div class="mc-opp" id="mc-opp-name">—</div>
    <div class="mc-link-row" id="mc-link-row">
      <a id="mc-join" target="_blank" rel="noopener">🔗 Vào Parsec ngay →</a>
      <button id="mc-copy" onclick="copyLink('overlay')" title="Copy link">📋</button>
    </div>
    <p class="mc-nolink" id="mc-nolink" style="display:none">
      Chưa có link — liên hệ đối thủ để trao đổi!
    </p>
    <button id="mc-close" onclick="closeMatchOverlay()">Đã hiểu</button>
    <div class="mc-timer" id="mc-timer"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Bottom sheet: register / edit -->
<div class="overlay" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <h2 id="sheet-title">👋 Tạo hồ sơ</h2>
    <div class="fgrp">
      <label>Tên hiển thị</label>
      <input id="f-name" placeholder="Tên của bạn" maxlength="30">
    </div>
    <div class="fgrp">
      <label>ID Parsec</label>
      <input id="f-ingame" placeholder="VD: nhimbeti" maxlength="30">
    </div>
    <div class="fgrp">
      <label>Tier</label>
      <select id="f-tier">
        <option value="Tier 1">Tier 1 ⭐⭐⭐⭐⭐</option>
        <option value="Tier 2">Tier 2 ⭐⭐⭐⭐</option>
        <option value="Tier 3" selected>Tier 3 ⭐⭐⭐</option>
        <option value="Tier 4">Tier 4 ⭐⭐</option>
        <option value="Tier 5">Tier 5 ⭐</option>
      </select>
    </div>
    <div class="fgrp">
      <label>Link Parsec <small style="color:var(--hint)">(để trống nếu chưa có)</small></label>
      <input id="f-parsec" placeholder="https://parsec.gg/...">
    </div>
    <button class="btn-save" onclick="saveProfile()">💾 Lưu hồ sơ</button>
    <div style="height:8px"></div>
  </div>
</div>

<script>
// ── Telegram SDK ───────────────────────────────────────────────────────────────
const tg     = window.Telegram?.WebApp;
const tgUser = tg?.initDataUnsafe?.user;

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); } catch(e){}
  try { tg.enableClosingConfirmation(); } catch(e){}
}

function haptic(type='light') {
  try { tg?.HapticFeedback.impactOccurred(type); } catch(e){}
}

// ── State ──────────────────────────────────────────────────────────────────────
const TIER_STARS = {'Tier 1':'⭐⭐⭐⭐⭐','Tier 2':'⭐⭐⭐⭐','Tier 3':'⭐⭐⭐','Tier 4':'⭐⭐','Tier 5':'⭐'};
const TIER_CLASS  = {'Tier 1':'t1','Tier 2':'t2','Tier 3':'t3','Tier 4':'t4','Tier 5':'t5'};
const AV_COLORS   = ['#ef5350','#e91e63','#9c27b0','#3f51b5','#2196f3','#009688','#4caf50','#ff9800','#ff5722'];

let S = { webId: null, profile: null, ready: false, matched: false };

function avColor(name) {
  let h = 0; for (let c of (name||'')) h = (h*31+c.charCodeAt(0)) % AV_COLORS.length;
  return AV_COLORS[h];
}
function initials(name) {
  return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

// ── API ────────────────────────────────────────────────────────────────────────
function hdr() {
  return S.webId ? {'Content-Type':'application/json','X-Web-Id':S.webId} : {'Content-Type':'application/json'};
}
async function api(path, method='GET', body=null) {
  try {
    const r = await fetch(path, {method, headers:hdr(), body:body?JSON.stringify(body):null});
    return r.json();
  } catch(e) { return {}; }
}

// ── Boot ───────────────────────────────────────────────────────────────────────
async function boot() {
  // Use Telegram user ID if available, else localStorage UUID
  S.webId = tgUser ? `tg_${tgUser.id}` : localStorage.getItem('pes_id');

  if (S.webId) {
    const d = await api('/api/profile');
    if (d.web_id) { S.profile = d; renderPanel(); }
    else { if (!tgUser) { localStorage.removeItem('pes_id'); S.webId = null; } }
  }

  if (!S.profile) {
    // Auto-fill from Telegram if available
    if (tgUser) {
      const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
      document.getElementById('f-name').value   = fullName;
      document.getElementById('f-ingame').value = tgUser.username || '';
    }
    openSheet(true);
  }

  // Show fallback buttons if not in Telegram
  if (!tg) {
    document.getElementById('fallback-btns').style.display = 'flex';
  }

  await refreshLobby();
  pingOnline();
  setInterval(refreshLobby, 3000);
  setInterval(checkStatus,  2500);
  setInterval(pingOnline,   10000);
}

// ── Panel ──────────────────────────────────────────────────────────────────────
function renderPanel() {
  const p = S.profile;
  if (!p) return;

  const panel = document.getElementById('my-panel');
  panel.style.display = 'flex';

  const av = document.getElementById('my-av');
  av.textContent  = initials(p.display_name);
  av.style.background = avColor(p.display_name);

  document.getElementById('my-name').textContent = p.display_name;

  const avatarBtn = document.getElementById('avatar-btn');
  avatarBtn.textContent = initials(p.display_name);
  avatarBtn.style.background = avColor(p.display_name);
  avatarBtn.style.display = 'flex';

  updateSub();
  syncMainButton();
  updateActionRow();
}

function updateSub() {
  const p   = S.profile; if (!p) return;
  const dot = document.getElementById('status-dot');
  const sub = document.getElementById('my-sub');
  const ts  = TIER_STARS[p.tier] || '';

  if (S.ready) {
    dot.className = 'status-dot on';
    sub.innerHTML = `<span style="color:var(--accent)">● Đang tìm đối...</span>`;
  } else {
    dot.className = 'status-dot';
    const link = p.parsec_link ? p.parsec_link.replace('https://','').slice(0,28) : 'Chưa có link';
    sub.textContent = `${ts} ${p.tier} · 🔗 ${link}`;
  }
}

// ── MainButton (Telegram native — ⚡ Tự Ghép as primary) ────────────────────────
function syncMainButton() {
  if (!tg?.MainButton || !S.profile) return;
  tg.MainButton.offClick(onMainBtn);

  if (S.matched) { tg.MainButton.hide(); return; }

  if (S.ready) {
    tg.MainButton.setParams({text:'✕ Hủy', color:'#c0392b', text_color:'#ffffff'});
  } else {
    const c  = tg.themeParams.button_color      || '#5288c1';
    const ct = tg.themeParams.button_text_color || '#ffffff';
    tg.MainButton.setParams({text:'⚡ Tự Ghép', color:c, text_color:ct});
  }
  tg.MainButton.show();
  tg.MainButton.onClick(onMainBtn);
}

function onMainBtn() {
  haptic('medium');
  S.ready ? cancelReady() : doReady(true);
}

// ── Lobby ──────────────────────────────────────────────────────────────────────
async function refreshLobby() {
  const players = await api('/api/lobby');
  const others  = players.filter(p => p.web_id !== S.webId);
  const el      = document.getElementById('lobby');

  if (!others.length) {
    el.innerHTML = `<div class="empty"><span>😴</span>Chưa có ai tìm đối<br>
      <small style="margin-top:6px;display:block">Nhấn "Tìm Đối" để vào hàng chờ!</small></div>`;
    return;
  }
  el.innerHTML = others.map(buildCard).join('');
}

function buildCard(p) {
  const tc    = TIER_CLASS[p.tier] || 't5';
  const ts    = TIER_STARS[p.tier] || '';
  const color = avColor(p.display_name);
  const ini   = initials(p.display_name);
  const myId  = S.webId;

  if (!p.is_ready && p.matched_with && p.matched_with !== myId) {
    return `<div class="card locked">
      <div class="c-av" style="background:${color}">${ini}</div>
      <div class="c-info">
        <div class="c-name">${e(p.display_name)}</div>
        <div class="c-sub">🔒 Đã có đôi</div>
      </div>
    </div>`;
  }

  if (!p.is_ready && p.matched_with === myId && p.match_link) {
    return `<div class="card matched">
      <div class="c-av" style="background:${color}">${ini}</div>
      <div class="c-info">
        <div class="c-name">${e(p.display_name)}</div>
        <div class="c-sub">⚔️ Đang host cho bạn!</div>
      </div>
      <a class="btn-h them" href="${e(p.match_link)}" target="_blank">🔗 Vào</a>
    </div>`;
  }

  const canConnect = !!S.profile && p.web_id !== myId;
  const actions = canConnect
    ? `<div class="c-actions">
        <button class="btn-h them" onclick="connect('${p.web_id}','them')">Host bạn</button>
        <button class="btn-h me"   onclick="connect('${p.web_id}','me')">Host tôi</button>
      </div>`
    : `<div class="c-actions" style="font-size:.7rem;color:var(--hint)">⚠️</div>`;

  const hostTag = p.parsec_link
    ? `<span class="htag has-host">✅ Có Host</span>`
    : `<span class="htag no-host">🚫 No Host</span>`;

  return `<div class="card">
    <div class="c-av" style="background:${color}">${ini}<div class="dot"></div></div>
    <div class="c-info">
      <div class="c-name">${e(p.display_name)}</div>
      <div class="c-sub">
        <span class="tbadge ${tc}">${ts} ${p.tier}</span>
        ${hostTag}
        ${p.ingame_name ? `<br>🎮 ${e(p.ingame_name)}` : ''}
      </div>
    </div>
    ${actions}
  </div>`;
}

// ── Match overlay ──────────────────────────────────────────────────────────────
let _matchTimer;

function showMatchBanner(opponentName, link) {
  S.matched = true; S.ready = false;
  haptic('heavy');
  playMatchSound();
  updateSub(); syncMainButton(); updateFallbackBtns();

  // Update persistent banner
  const desc    = document.getElementById('match-desc');
  const nolink  = document.getElementById('match-nolink');
  const bannerRow = document.getElementById('banner-link-row');
  desc.textContent = opponentName ? `⚔️ Đối thủ: ${opponentName}` : '⚔️ Đã ghép trận!';
  if (link) {
    document.getElementById('btn-join').href = link;
    bannerRow.style.display = 'flex';
    bannerRow.dataset.link  = link;
    nolink.style.display    = 'none';
  } else {
    bannerRow.style.display = 'none';
    nolink.style.display    = 'block';
  }
  document.getElementById('match-banner').style.display = 'block';

  // Show fullscreen overlay popup
  document.getElementById('mc-opp-name').textContent = opponentName || '—';
  const mcLinkRow = document.getElementById('mc-link-row');
  const mcNolink  = document.getElementById('mc-nolink');
  if (link) {
    document.getElementById('mc-join').href = link;
    mcLinkRow.style.display = 'flex';
    mcLinkRow.dataset.link  = link;
    mcNolink.style.display  = 'none';
  } else {
    mcLinkRow.style.display = 'none';
    mcNolink.style.display  = 'block';
  }
  document.getElementById('match-overlay').classList.add('show');

  // Countdown auto-close (8s)
  let secs = 8;
  const timerEl = document.getElementById('mc-timer');
  timerEl.textContent = `Tự đóng sau ${secs}s`;
  clearInterval(_matchTimer);
  _matchTimer = setInterval(() => {
    secs--;
    if (secs <= 0) { clearInterval(_matchTimer); closeMatchOverlay(); }
    else timerEl.textContent = `Tự đóng sau ${secs}s`;
  }, 1000);
}

function closeMatchOverlay() {
  clearInterval(_matchTimer);
  document.getElementById('match-overlay').classList.remove('show');
  document.getElementById('mc-timer').textContent = '';
  document.getElementById('match-banner').scrollIntoView({behavior:'smooth', block:'center'});
}

// ── Status poll ────────────────────────────────────────────────────────────────
async function checkStatus() {
  if (!S.webId || S.matched) return;
  const s = await api('/api/status');
  if (s.matched_with && !S.matched) {
    showMatchBanner(s.opponent_name || '', s.match_link || '');
  }
}

// ── Ready ──────────────────────────────────────────────────────────────────────
async function doReady(auto) {
  if (!S.profile) { openSheet(true); return; }
  haptic('medium');
  S.ready = true; S.matched = false;
  document.getElementById('match-banner').style.display = 'none';
  updateSub(); syncMainButton(); updateActionRow(); updateFallbackBtns();
  toast(auto ? '⚡ Đang tự ghép...' : '🎮 Đã vào lobby...');

  const d = await api('/api/ready', 'POST', {auto});

  if (d.matched) {
    showMatchBanner(d.opponent || '', d.link || '');
  }
  refreshLobby();
}

async function cancelReady() {
  haptic('light');
  S.ready = false;
  updateSub(); syncMainButton(); updateActionRow(); updateFallbackBtns();
  await api('/api/cancel', 'POST', {});
  toast('🔴 Đã hủy');
  refreshLobby();
}

function updateActionRow() {
  const row  = document.getElementById('action-row');
  const b1   = document.getElementById('btn-lobby');
  const b2   = document.getElementById('btn-auto');
  const bcan = document.getElementById('btn-cancel2');

  if (!S.profile || S.matched) { row.classList.remove('show'); return; }
  row.classList.add('show');
  if (S.ready) {
    b1.style.display = 'none'; b2.style.display = 'none'; bcan.style.display = 'flex';
  } else {
    b1.style.display = ''; b2.style.display = ''; bcan.style.display = 'none';
  }
}

function updateFallbackBtns() {
  const r = document.getElementById('fbtn-ready');
  const c = document.getElementById('fbtn-cancel');
  if (S.ready) {
    r.style.display = 'none'; c.style.display = 'block';
  } else {
    r.style.display = 'block'; c.style.display = 'none';
  }
}

// ── Connect ────────────────────────────────────────────────────────────────────
async function connect(targetId, host) {
  if (!S.profile) { openSheet(true); return; }
  haptic('medium');
  const d = await api('/api/connect', 'POST', {target_id: targetId, host});
  if (d.error) { toast('⚠️ ' + d.error); refreshLobby(); return; }

  // Mở link ngay nếu có
  if (d.link) {
    if (tg) tg.openLink(d.link);
    else window.open(d.link, '_blank', 'noopener');
  }

  // Hiện overlay match (kể cả khi không có link)
  showMatchBanner(d.opponent || '', d.link || '');
  refreshLobby();
}

// ── Sheet (bottom sheet) ───────────────────────────────────────────────────────
function openSheet(required=false) {
  const p = S.profile;
  document.getElementById('sheet-title').textContent = p ? '✏️ Chỉnh hồ sơ' : '👋 Tạo hồ sơ';
  if (p) {
    document.getElementById('f-name').value   = p.display_name || '';
    document.getElementById('f-ingame').value = p.ingame_name  || '';
    document.getElementById('f-tier').value   = p.tier         || 'Tier 3';
    document.getElementById('f-parsec').value = p.parsec_link  || '';
  }
  document.getElementById('sheet-overlay').classList.add('open');

  // Telegram BackButton to close sheet
  if (tg?.BackButton && !required) {
    tg.BackButton.show();
    tg.BackButton.onClick(closeSheet);
  }
}

function closeSheet() {
  if (!S.profile) return;
  document.getElementById('sheet-overlay').classList.remove('open');
  tg?.BackButton.hide();
}

document.getElementById('sheet-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('sheet-overlay')) closeSheet();
});

async function saveProfile() {
  const name   = document.getElementById('f-name').value.trim();
  const ingame = document.getElementById('f-ingame').value.trim();
  if (!name) { toast('⚠️ Nhập tên hiển thị!'); return; }
  haptic('light');

  const d = await api('/api/register', 'POST', {
    web_id:       S.webId,
    display_name: name,
    ingame_name:  ingame,
    tier:         document.getElementById('f-tier').value,
    parsec_link:  document.getElementById('f-parsec').value.trim(),
  });

  if (d.error) { toast('⚠️ ' + d.error); return; }
  S.webId   = d.web_id;
  S.profile = d.profile;
  if (!tgUser) localStorage.setItem('pes_id', d.web_id);
  document.getElementById('sheet-overlay').classList.remove('open');
  tg?.BackButton.hide();
  renderPanel();
  toast('✅ Đã lưu hồ sơ!');
}

// ── Ping online ────────────────────────────────────────────────────────────────
async function pingOnline() {
  if (!S.webId) return;
  const d = await api('/api/ping', 'POST', {});
  if (d.online !== undefined)
    document.getElementById('online-count').textContent = `🟢 ${d.online} online`;
}

// ── Sound ──────────────────────────────────────────────────────────────────────
function playMatchSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523,659,784,1047].forEach((freq,i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.35, t+.02);
      gain.gain.linearRampToValueAtTime(0, t+.18);
      osc.start(t); osc.stop(t+.2);
    });
  } catch(e){}
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2800);
}

function copyLink(src) {
  const row  = document.getElementById(src === 'overlay' ? 'mc-link-row' : 'banner-link-row');
  const link = row?.dataset.link || document.getElementById(src === 'overlay' ? 'mc-join' : 'btn-join')?.href;
  if (!link) return;
  haptic('light');
  navigator.clipboard.writeText(link).then(() => {
    const btn = src === 'overlay' ? document.getElementById('mc-copy') : row.querySelector('.btn-copy');
    const orig = btn.textContent;
    btn.textContent = '✅';
    setTimeout(() => { btn.textContent = orig; }, 1500);
    toast('📋 Đã copy link!');
  }).catch(() => {
    // Fallback for older browsers
    const el = document.createElement('textarea');
    el.value = link; document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    document.body.removeChild(el);
    toast('📋 Đã copy link!');
  });
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

boot();
</script>
